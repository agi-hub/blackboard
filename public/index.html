<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="敲黑板" />
  <meta name="theme-color" content="#1c1813" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>敲黑板</title>
  <link rel="stylesheet" href="style.css?v=18" />
  <!-- CDN 开源楷体兜底（霞鹜文楷）：本地楷体名全部失效的环境（如 Safari 26 某些配置）自动启用，按需切片下载 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.6.0/style.css" />
</head>
<body>
  <!-- 顶部工具栏：左侧品牌，右侧功能 -->
  <header id="toolbar">
    <div class="tb-group brand">
      <span class="brand-logo">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <rect x="2" y="3" width="28" height="22" rx="3" fill="#6b4a2c"/>
          <rect x="5" y="6" width="22" height="16" rx="1.5" fill="#2b4a3a"/>
          <path d="M9 12 h10" stroke="#f2f0e6" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 16 h6" stroke="#ffe066" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="10" y="26.5" width="12" height="2.6" rx="1.3" fill="#f2f0e6"/>
        </svg>
      </span>
      <span class="brand-name">敲黑板</span>
    </div>

    <div class="tb-group spacer-right">
      <button id="btn-layout" class="ai-btn" title="输入文字素材或拍张照片，AI 精炼排版为板书">输入素材</button>
      <button id="btn-narrate" class="ai-btn primary" title="停止/继续 配音讲解">讲解</button>
      <button id="btn-replay" class="ai-btn" title="从本页开头重新讲解">重播</button>
      <button id="btn-ask" class="ai-btn" title="进入提问模式：用鼠标指向黑板某行文字，AI 就地解释">问问题</button>
    </div>
    <div class="tb-group" id="page-nav" title="黑板翻页（←/→）">
      <button id="btn-prev-page" class="tool-btn nav-btn" title="上一页 (←)">◀</button>
      <span id="page-indicator">1 / 1</span>
      <button id="btn-next-page" class="tool-btn nav-btn" title="下一页 (→)">▶</button>
    </div>

    <div class="tb-group">
      <button id="btn-fullscreen" class="tool-btn" title="全屏黑板（也可双击黑板）">全屏</button>
      <button id="btn-theme" class="tool-btn" title="切换黑板 / 绿板">主题</button>
      <button id="btn-export" class="tool-btn" title="截屏当前黑板为高清 PNG">截屏</button>
      <button id="btn-save-course" class="tool-btn" title="保存课程（板书+讲稿，纯文本 JSON）">保存</button>
      <button id="btn-load-course" class="tool-btn" title="加载课程文件，恢复板书与讲解">加载</button>
      <button id="btn-settings" class="tool-btn" title="设置（模型/配音/外观）">设置</button>
      <button id="btn-rail" class="tool-btn" title="隐藏/显示左侧粉笔槽（投影时腾出更大黑板）">隐藏粉笔</button>
      <button id="btn-lang" class="tool-btn" title="切换中文 / Switch to English">EN</button>
    </div>
  </header>
  <input id="course-file" type="file" accept=".json,application/json" hidden />
  <input id="board-image" type="file" accept="image/*" hidden />
  <input id="board-camera" type="file" accept="image/*" capture="environment" hidden />

  <main id="stage">
    <!-- 左侧粉笔槽（磁吸上墙：木条轨道 + 磁铁贴粉笔 + 板擦） -->
    <aside id="chalk-rail" title="粉笔槽">
      <div class="rail-chalks">
        <button class="chalk-dot" data-color="#f2f0e6" style="--c:#f2f0e6" aria-label="白色粉笔"></button>
        <button class="chalk-dot" data-color="#ffe066" style="--c:#ffe066" aria-label="黄色粉笔"></button>
        <button class="chalk-dot" data-color="#ffab6e" style="--c:#ffab6e" aria-label="橙色粉笔"></button>
        <button class="chalk-dot" data-color="#ff9ec4" style="--c:#ff9ec4" aria-label="粉色粉笔"></button>
        <button class="chalk-dot" data-color="#9fd8ff" style="--c:#9fd8ff" aria-label="蓝色粉笔"></button>
        <button class="chalk-dot" data-color="#b8f2b8" style="--c:#b8f2b8" aria-label="绿色粉笔"></button>
        <button class="chalk-dot" data-color="#d8b8ff" style="--c:#d8b8ff" aria-label="紫色粉笔"></button>
      </div>
      <div class="rail-divider"></div>
      <div class="rail-sizes" title="粉笔粗细">
        <button class="size-btn" data-size="3"><i class="dot s"></i></button>
        <button class="size-btn active" data-size="5"><i class="dot m"></i></button>
        <button class="size-btn" data-size="9"><i class="dot l"></i></button>
      </div>
      <div class="rail-divider"></div>
      <button id="btn-eraser" class="rail-eraser" title="橡皮擦（板擦）"><span class="felt"></span></button>
      <div class="rail-divider"></div>
      <button id="btn-undo" class="rail-tool" title="撤销 (Ctrl/Cmd+Z)">撤销</button>
      <button id="btn-clear" class="rail-tool danger" title="清空黑板">清屏</button>
    </aside>

    <!-- 黑板（木框 + 三层画布） -->
    <div id="board-frame">
      <div id="board">
        <canvas id="bg-canvas"></canvas>
        <canvas id="stroke-canvas"></canvas>
        <canvas id="text-canvas"></canvas>
        <div id="eraser-cursor" hidden></div>
        <!-- 粉笔槽 -->
        <div id="chalk-ledge"><span></span></div>
      </div>
    </div>

    <!-- 右侧抽屉：输入素材（文本及图片）转板书 -->
    <aside id="drawer">
      <div class="drawer-head">
        <h2>文本及图片 → 板书</h2>
        <button id="btn-drawer-close" class="tool-btn" title="收起">✕</button>
      </div>
      <textarea id="text-input" placeholder="粘贴文本…（可配合下方图片）"></textarea>
      <div id="img-preview" class="hidden"><img id="img-thumb" alt="待识别图片" /><button id="btn-img-remove" class="tool-btn" title="移除图片">✕</button></div>
      <div class="drawer-actions">
        <button id="btn-image" class="tool-btn" title="拍照或从相册选图（选图后可裁剪），题目图片会自动附解题过程">上传图像</button>
        <button id="btn-generate" class="ai-btn primary">开始学习</button>
      </div>
    </aside>

    <!-- 图片裁剪弹层：拍/选图后先裁剪再进入素材 -->
    <div id="crop-modal" class="modal-mask hidden">
      <div class="modal crop-modal">
        <div class="drawer-head">
          <h2>裁剪图片</h2>
          <button id="btn-crop-cancel" class="tool-btn" title="放弃图片">✕</button>
        </div>
        <div id="crop-stage">
          <img id="crop-img" alt="待裁剪图片" draggable="false" />
          <div id="crop-box"></div>
        </div>
        <div class="drawer-actions">
          <button id="btn-crop-reset" class="tool-btn">重选区域</button>
          <button id="btn-crop-rotate" class="tool-btn">旋转 90°</button>
          <button id="btn-crop-ok" class="ai-btn primary">使用图片</button>
      </div>
      </div>
    </div>

    <!-- 右侧 AI 解答区（独立小黑板，不与板书混排） -->
    <aside id="answer-panel" class="hidden">
      <div class="drawer-head">
        <h2>AI 解答</h2>
        <button id="btn-answer-close" class="tool-btn" title="收起解答区">✕</button>
      </div>
      <p class="drawer-tip">解答写在这块小黑板上，不影响左侧板书；点击可跳过书写。</p>
      <div id="ap-board"><canvas id="ap-canvas"></canvas></div>
    </aside>

    <!-- 右侧讲义区：老师口述实时记录（念一句，多一句） -->
    <aside id="lecture-panel" class="hidden">
      <div class="drawer-head">
        <h2>讲义</h2>
        <button id="btn-lecture-close" class="tool-btn" title="收起讲义">✕</button>
      </div>
      <p class="drawer-tip">老师口述内容实时记录，念一句多一句；颜色跟随对应板书块。</p>
      <div id="lecture-body"></div>
    </aside>
  </main>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal-mask hidden">
    <div class="modal">
      <div class="drawer-head">
        <h2>设置</h2>
        <button id="btn-settings-close" class="tool-btn">✕</button>
      </div>
      <div class="modal-tabs">
        <button class="mtab active" data-tab="tab-llm">模型服务</button>
        <button class="mtab" data-tab="tab-tts">配音 TTS</button>
        <button class="mtab" data-tab="tab-look">外观</button>
      </div>
      <div class="tab-panes">
        <div class="tab-pane active" id="tab-llm">
          <label>接口地址 baseUrl（OpenAI 兼容 /chat/completions）
            <input id="cfg-baseUrl" type="text" autocomplete="off" />
          </label>
          <label>API Key（留打码值表示不修改）
            <input id="cfg-apiKey" type="password" autocomplete="off" placeholder="sk-…" />
          </label>
          <label>文本模型（板书排版）
            <input id="cfg-textModel" type="text" autocomplete="off" />
          </label>
          <label>限流（次/分钟）
            <input id="cfg-maxRPM" type="number" min="1" max="60" />
          </label>
          <label class="check-row">禁用深度思考（大幅提速，模型不支持时自动忽略）
            <input id="cfg-disableThinking" type="checkbox" />
          </label>
        </div>
        <div class="tab-pane" id="tab-tts">
          <label>接口地址（SiliconFlow 兼容 /audio/speech）
            <input id="cfg-ttsBaseUrl" type="text" autocomplete="off" />
          </label>
          <label>API Key（留打码值表示不修改）
            <input id="cfg-ttsApiKey" type="password" autocomplete="off" />
          </label>
          <label>模型
            <input id="cfg-ttsModel" type="text" autocomplete="off" />
          </label>
          <label>讲解音色（男/女声预置）
            <select id="cfg-voice"></select>
          </label>
        </div>
        <div class="tab-pane" id="tab-look">
          <label>板书字体
            <select id="cfg-font"></select>
          </label>
          <label>字体磨砂感（粉笔颗粒强度）
            <select id="cfg-grain">
              <option value="0">无（纯净字体）</option>
              <option value="0.7">轻磨砂</option>
              <option value="1.3" selected>标准磨砂</option>
              <option value="1.8">重磨砂</option>
              <option value="2.2">很重（石膏感）</option>
            </select>
          </label>
        </div>
      </div>
      <div class="drawer-actions">
        <span id="cfg-status" class="cfg-status"></span>
        <button id="btn-cfg-save" class="ai-btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- AI 思考中遮罩 -->
  <div id="thinking" class="hidden">
    <div class="chalk-spin"></div>
    <div id="thinking-text">AI 正在思考…</div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="hidden"></div>

  <script>
    // 缓存自检：app.js 版本不符（旧缓存）→ 强制整页刷新一次绕过缓存
    window.addEventListener("load", function () {
      if (window.__APP_VER !== 3) {
        window.location.replace("/?cachebust=" + Date.now());
      }
    });
  </script>
  <script src="app.js?v=18"></script>
