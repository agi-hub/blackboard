name: media-release
on:
  push:
    paths: ['.github/workflows/media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets
      - name: 发布演示视频到 Release（正确 MIME，幂等）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view media >/dev/null 2>&1 \
            || gh release create media --title "演示素材" --notes "README 演示视频；源文件在 assets 分支"
          RID=$(gh api "repos/$REPO/releases/tags/media" --jq .id)
          for f in demo_zh.mp4 demo_en.mp4; do
            gh release delete-asset media "$f" -y || true
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: video/mp4" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$f" >/dev/null
          done
